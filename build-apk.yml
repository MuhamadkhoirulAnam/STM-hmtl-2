name: Build STM COMPANY APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Firebase configuration
        run: |
          if [ -f app/google-services.json ]; then
            echo "Firebase Android configuration found."
          else
            echo "::warning::app/google-services.json is missing. APK will build, but FCM will not initialize until this file is added."
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stm-company-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
